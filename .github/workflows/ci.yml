name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` is broken for lockfiles generated on a different OS due to a
      # long-standing npm bug with optional platform binaries (rollup / lightningcss).
      # See https://github.com/npm/cli/issues/4828 — `npm install` reconciles.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm test
